version: '3.8'

services:
  git-executor:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: collabops/git-executor:latest
    container_name: collabops-git-executor
    restart: unless-stopped
    ports:
      - "8081:8081"  # Using our configured local port
    volumes:
      # Configuration volume
      - ../config:/config:ro
      # Git repositories volume  
      - git-repos:/repos
      # Logs volume (if needed)
      - logs:/var/log/collabops
    environment:
      # Configuration overrides via environment variables
      - COLLABOPS_SERVER_HOST=0.0.0.0
      - COLLABOPS_SERVER_PORT=8081
      - COLLABOPS_GIT_REPO_ROOT=/repos
      - COLLABOPS_LOG_LEVEL=debug
      - COLLABOPS_LOG_FORMAT=json
      - COLLABOPS_LOG_OUTPUT=stdout
    networks:
      - collabops-network
    healthcheck:
      test: ["CMD", "./git-executor", "--health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security settings
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Optional: Development tools container
  git-executor-dev:
    build:
      context: ..
      dockerfile: deployments/Dockerfile.dev
    image: collabops/git-executor:dev
    container_name: collabops-git-executor-dev
    restart: "no"
    ports:
      - "9091:9090"  # Dev port
    volumes:
      # Mount configuration and repos
      - ../config:/config:ro
      - git-repos:/repos
    environment:
      - COLLABOPS_SERVER_HOST=0.0.0.0
      - COLLABOPS_SERVER_PORT=9090
      - COLLABOPS_GIT_REPO_ROOT=/repos
      - COLLABOPS_LOG_LEVEL=debug
      - COLLABOPS_LOG_FORMAT=text
      - COLLABOPS_LOG_DEVELOPMENT=true
    networks:
      - collabops-network
    profiles:
      - dev  # Only start with --profile dev

volumes:
  git-repos:
    driver: local
  logs:
    driver: local

networks:
  collabops-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 