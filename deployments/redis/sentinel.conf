# Redis Sentinel configuration for CollabOps Git Executor
# High Availability setup for L2 cache

# Basic settings
port 26379
dir /tmp

# Sentinel configuration
sentinel monitor mymaster redis-primary 6379 2
sentinel auth-pass mymaster ""  # Set password if Redis has auth enabled
sentinel down-after-milliseconds mymaster 30000
sentinel parallel-syncs mymaster 1
sentinel failover-timeout mymaster 180000

# Sentinel behavior
sentinel deny-scripts-reconfig yes

# Logging
logfile /var/log/redis/sentinel.log
loglevel notice

# Announcement settings (important for containerized environments)
# sentinel announce-ip 127.0.0.1
# sentinel announce-port 26379

# Notification scripts (optional)
# sentinel notification-script mymaster /var/redis/notify.sh
# sentinel client-reconfig-script mymaster /var/redis/reconfig.sh

# Security (uncomment for production)
# requirepass your_sentinel_password_here
# sentinel auth-user mymaster your_redis_username
# sentinel auth-pass mymaster your_redis_password