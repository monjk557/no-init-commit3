# Redis configuration for CollabOps Git Executor L2 Cache
# Optimized for directory listing caching workload

# Network and Connection Settings
bind 0.0.0.0
port 6379
tcp-backlog 511
tcp-keepalive 60
timeout 300

# General Settings
databases 16
daemonize no
supervised no
pidfile /var/run/redis_6379.pid

# Logging
loglevel notice
logfile /var/log/redis/redis.log
syslog-enabled no

# Memory Management - Optimized for caching workload
maxmemory 1gb
maxmemory-policy allkeys-lru  # Evict least recently used keys
maxmemory-samples 5

# Lazy freeing - useful for large datasets
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# Persistence Settings
# RDB (Redis Database) - Point-in-time snapshots
save 900 1      # Save after 900 seconds if at least 1 key changed
save 300 10     # Save after 300 seconds if at least 10 keys changed
save 60 10000   # Save after 60 seconds if at least 10000 keys changed

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) - Log every write operation
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec  # Sync to disk every second (good balance)

no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

aof-load-truncated yes
aof-use-rdb-preamble yes  # Use RDB format for AOF rewrites

# Client Settings
maxclients 10000
timeout 300

# Performance Optimizations for Cache Workload
# Hash settings - optimize for directory listings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List settings
list-max-ziplist-size -2
list-compress-depth 0

# Set settings
set-max-intset-entries 512

# Sorted set settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog settings
hll-sparse-max-bytes 3000

# Streams settings
stream-node-max-bytes 4kb
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Client query buffer
client-query-buffer-limit 1gb

# Protocol settings
proto-max-bulk-len 512mb

# Security Settings (basic)
# protected-mode yes  # Commented out for container use
# requirepass your_password_here  # Uncomment and set password for production

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
# rename-command SHUTDOWN SHUTDOWN_PLEASE_USE_SIGTERM_INSTEAD

# Lua Scripting
lua-time-limit 5000

# Slow Log - Monitor slow queries
slowlog-log-slower-than 10000  # Log queries slower than 10ms
slowlog-max-len 128

# Latency Monitoring
latency-monitor-threshold 100  # Monitor operations taking longer than 100ms

# Key Expiration
# Active expiration settings - important for cache TTL
hz 10  # Frequency of background task that expires keys

# Memory Usage Tracking
tracking-table-max-keys 1000000

# Threaded I/O (Redis 6.0+)
io-threads 4  # Use 4 I/O threads for better performance
io-threads-do-reads yes

# Modules (if needed)
# loadmodule /path/to/module.so

# TLS Settings (commented out - enable for production with proper certificates)
# port 0  # Disable non-TLS port
# tls-port 6380
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt
# tls-dh-params-file /path/to/redis.dh
# tls-protocols "TLSv1.2 TLSv1.3"
# tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
# tls-prefer-server-ciphers yes
# tls-session-caching no
# tls-session-cache-size 5000
# tls-session-cache-timeout 60

# Sentinel Configuration (for HA setups)
# sentinel announce-ip 127.0.0.1
# sentinel announce-port 26379

# Module specific configurations
# Add any module-specific configurations here

# Custom CollabOps Settings
# These are Redis-standard settings optimized for our caching use case:

# Optimize for read-heavy workload (typical for directory caches)
replica-read-only yes
replica-serve-stale-data yes

# Memory efficiency for string values (directory listings are often large JSON)
hash-max-ziplist-entries 64
hash-max-ziplist-value 512

# Background saving settings for cache workload
rdbcompression yes
rdbchecksum yes

# Optimize for network efficiency
tcp-keepalive 60
timeout 300

# Eviction policy specifically for cache use case
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Auto-expire settings optimized for cache TTLs
hz 10