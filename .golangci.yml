# CollabOps 사내 Go 공통 golangci-lint 표준 (FLOOR)
# ---------------------------------------------------------------------------
# 이 파일은 모든 Go repo 가 최소한으로 채택해야 하는 "바닥(floor)" 설정이다.
# - 포맷터: gofmt + goimports (golangci-lint v2 formatters 로 통합 관리)
# - linter:  default standard (errcheck/govet/ineffassign/staticcheck/unused) + misspell
#
# depguard / gosec / revive 같은 강한 룰은 기본 포함하지 않는다(=opt-in).
# repo 가 import boundary 강제(depguard)나 보안 스캔(gosec)이 필요하면
# 본 파일을 기반으로 enable 에 추가한다. 예시는 CONVENTIONS.md "에스컬레이션" 참고.
#
# 로컬:  make lint        CI: golangci-lint run ./...
version: "2"

run:
  timeout: 5m

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - misspell # 오타 검출
  exclusions:
    rules:
      # 테스트 코드의 errcheck 는 완화 (assert 헬퍼/정리 코드에서 노이즈가 큼)
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
