# Native Git Migration Configuration
# Controls gradual rollout from go-git to native Git subprocess operations

migration:
  # Global control - master switch for all native Git operations
  enable_native_git: true  # 🚀 FULL ROLLOUT ENABLED

  # Operation-specific flags - granular control over which operations use native Git
  operations:
    enable_native_three_way: true     # 🚀 ENABLED - Three-way merges
    enable_native_squash: true        # 🚀 ENABLED - Squash merges
    enable_native_rebase: true        # 🚀 ENABLED - Rebase operations
    enable_native_fast_forward: true  # 🚀 ENABLED - Fast-forward merges

  # Repository-based rollout control
  repositories:
    # Specific repositories to enable native Git (takes precedence over percentage)
    enabled: []
    # Example: ["user1/repo1", "organization/critical-repo"]

    # Specific repositories to keep on go-git (takes precedence over enabled)
    disabled: []
    # Example: ["legacy/old-repo", "unstable/experimental"]

  # Percentage-based gradual rollout (0-100)
  # Only applies to repositories not explicitly enabled/disabled
  rollout_percentage: 100  # 🚀 FULL ROLLOUT - All operations use native Git

  # Safety and validation controls
  safety:
    # Validate native Git results against go-git results
    validate_results: true        # ✅ Keep validation enabled for monitoring

    # Automatically fallback to go-git if native Git fails
    fallback_on_error: true       # ✅ Safety net enabled

    # Run validation in background (faster) vs synchronously (safer)
    parallel_validation: true     # ✅ Background validation for performance

    # Maximum time to spend on validation
    validation_timeout: 30s       # ✅ Reasonable timeout

  # Performance monitoring
  monitoring:
    # Enable detailed performance metrics collection
    enable_metrics: true

    # Enable distributed tracing for operations
    enable_tracing: true

    # Log slow operations above this threshold
    slow_operation_threshold: 10s

# Example migration rollout plan:
#
# Week 1: Set enable_native_git: true, rollout_percentage: 5
#         Monitor metrics, validate results
#
# Week 2: If stable, increase rollout_percentage: 25
#         Add critical repositories to enabled list
#
# Week 3: rollout_percentage: 50
#         Begin enabling specific operations (enable_native_three_way: true)
#
# Week 4: rollout_percentage: 100
#         Enable all operations, monitor for issues
#
# Week 5+: Disable validation (validate_results: false) for performance
#          Remove go-git code paths when confident

# Production example - gradual three-way merge migration:
# migration:
#   enable_native_git: true
#   operations:
#     enable_native_three_way: true
#     enable_native_squash: false
#     enable_native_rebase: false
#   rollout_percentage: 25
#   safety:
