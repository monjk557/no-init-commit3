# Docker Configuration for CollabOps Git Executor
# Used for Docker local integration testing

# HTTP Server Configuration
server:
  port: 5001
  host: "0.0.0.0"
  base_path: "/"
  read_timeout: "60s"
  write_timeout: "60s"
  idle_timeout: "300s"
  enable_docs: true
  docs_path: "/api-docs"

# Git Repository Configuration
git:
  repo_root: "/opt/repos"
  enable_packfile: true
  max_cache_size: 100
  cache_ttl: "5m"

# JWT Configuration
jwt:
  algorithm: "HS256"
  secret_key: "git_executor_jwt_secret_local_integration_test"

# Permission Service Configuration (disabled for local testing)
# permissions:
#   api_service_url: "http://collabops-api-orchestrator:2345"

# Logging Configuration
log:
  level: "info"
  format: "json"
  output: "stdout"
  development: false
