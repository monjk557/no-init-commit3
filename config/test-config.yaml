# Test Configuration for CollabOps Git Executor
# Used for testing the file diff endpoint

# HTTP Server Configuration
server:
  port: 3000
  host: "localhost"
  base_path: "/"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"
  enable_docs: true
  docs_path: "/api-docs"

# Git Repository Configuration
git:
  repo_root: "/Users/atci/Documents/GitHub/collabops-git-executor/test-repos"
  enable_packfile: true
  max_cache_size: 10
  cache_ttl: "5m"

# JWT Configuration (using simple HS256 for testing)
jwt:
  algorithm: "HS256"
  secret_key: "test-secret-key-for-development"

# Logging Configuration
log:
  level: "debug"
  format: "text"
  output: "stdout"
  development: true
