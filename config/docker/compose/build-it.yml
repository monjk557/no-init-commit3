version: '3.8'

services:
  collabops-git-executor:
    build:
      context: ../../../../collabops-git-executor
      dockerfile: config/docker/Dockerfile
    env_file:
      - ../../env/build-it/git-executor.env
    volumes:
      - git_pipelines_data:${GIT_REPO_ROOT}
      - git_executor_data:${GIT_REPO_ROOT}
      - ../../../../collabops-git-executor:/app
      - /app/tmp
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=collabops-git-executor"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  git_executor_data:
  git_pipelines_data:

networks:
  collabops-network:
    driver: bridge