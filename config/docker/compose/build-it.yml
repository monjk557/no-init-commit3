services:
  collabops-git-executor:
    build:
      context: ../../../../collabops-git-executor
      dockerfile: config/docker/Dockerfile.dev
    ports:
      - "5001:5001"
      - "5222:5222"
    command: ["sh", "-c", "mkdir -p /app/tmp /app/build/go-build /app/build/go-mod && air"]
    env_file:
      - ../../env/build-it/git-executor.env
    environment:
      - GOCACHE=/app/build/go-build
      - GOMODCACHE=/app/build/go-mod
    user: "2000:2000"
    volumes:
      - nfs_git_repos:/var/lib/git/repos
      - ../../../../collabops-git-executor:/app
    networks:
      - collabops-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=collabops-git-executor"

  collabops-api-orchestrator:
    build:
      context: ../../../../collabops-api-orchestrator
      dockerfile: config/docker/Dockerfile
      args:
        APP_ENV: local
        ENABLE_RELOAD: "true"
    ports:
      - "2345:2345"
    volumes:
      - ../../../../collabops-api-orchestrator/app:/app/app:ro
      - ../../../../collabops-api-orchestrator/config:/app/config:ro
      - ../../../../collabops-api-orchestrator/pyproject.toml:/app/pyproject.toml:ro
      - ../../../../collabops-api-orchestrator/uv.lock:/app/uv.lock:ro
      - ../../../../collabops-api-orchestrator/pytest.ini:/app/pytest.ini:ro
    env_file:
      - ../../env/build-it/orchestrator.env
    entrypoint: ["uv", "run", "python", "/entrypoint.py"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "2345", "--reload", "--reload-dir", "/app/app", "--log-level", "debug"]
    depends_on:
      openfga:
        condition: service_started
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=orchestrator"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2345/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  collabops-api-piper:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/api-piper/collabops-api-piper:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "8001:8001"
    volumes:
      - nfs_git_repos:/var/lib/git/repos:ro
      - nfs_git_pipelines:/var/lib/git/pipelines
      - ~/.kube/config:/root/.kube/config:ro
    env_file:
      - ../../env/build-it/api-piper.env
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=piper"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  collabops-api-piper-specs:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/api-piper/collabops-api-piper-specs:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "8002:80"
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=api-piper-specs"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  collabops-gateway-ingress:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/gateway-ingress/collabops-gateway-ingress:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - '80:80'
    env_file:
      - ../../env/build-it/ingress-gateway.env
    depends_on:
      - collabops-web
      - collabops-api-orchestrator
      - collabops-api-service
      - collabops-git-executor
      - openfga
      - collabops-git-ssh
      - collabops-service-wtm
    networks:
      collabops-network:
        aliases:
          - collabops-local.ai
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  collabops-web:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/web/collabops-web:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - '3000:3000'
    env_file:
      - ../../env/build-it/web.env
    depends_on:
      - collabops-api-orchestrator
      - collabops-web-socket
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - 'localhost:host-gateway'

  collabops-web-socket:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/web-socket/collabops-web-socket:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - '3001:3001'
    env_file:
      - ../../env/build-it/web-socket.env
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  collabops-api-docs:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/api-docs/collabops-api-docs:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - '8084:8084'
    env_file:
      - ../../env/build-it/api-docs.env
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8084/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  collabops-api-service:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/api-service/collabops-api-service:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - '8000:8000'
    env_file:
      - ../../env/build-it/api-service.env
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'
        labels: 'service=api-service'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - 'localhost:host-gateway'

  openfga:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/service-rebac/collabops-service-rebac:latest
    platform: linux/amd64
    pull_policy: always
    entrypoint: ["/entrypoint.sh"]
    command: >
      run --datastore-engine=postgres
          --datastore-uri=postgres://postgres:apaoUsd4C7EGnMg9BWpy@192.168.0.30:5432/openfga?sslmode=disable
          --check-query-cache-enabled
          --playground-enabled
          --playground-port=3002
          --http-cors-allowed-origins=*
    env_file:
      - ../../env/build-it/openfga-db.env
    ports:
      - "8089:8080"
      - "8081:8081"
      - "3002:3002"
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  collabops-git-executor-specs:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/git-executor/collabops-git-executor-specs:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "5002:80"
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=git-executor-specs"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  collabops-git-ssh:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/git-ssh/collabops-git-ssh:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "22:22"
    env_file:
      - ../../env/build-it/git-ssh.env
    depends_on:
      - collabops-git-executor
      - collabops-api-orchestrator
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'
        labels: 'service=git-ssh'
    healthcheck:
      test: ['CMD', '/usr/local/bin/git-ssh', '-health-check']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  collabops-service-wtm:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/service-wtm/collabops-service-wtm:latest
    platform: linux/amd64
    pull_policy: always
    env_file:
      - ../../env/build-it/wtm.env
    ports:
      - "8082:8082"
    volumes:
      - nfs_git_repos:/var/lib/git/repos:rw
      - nfs_git_pipelines:/var/lib/git/pipelines:rw
    networks:
      - collabops-network
    depends_on:
      - collabops-git-executor
    restart: unless-stopped
    user: '2000:2000'
    group_add:
      - "2001"
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'
        labels: 'service=wtm'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8082/healthz']
      interval: 30s
      timeout: 10s
      retries: 3

  collabops-service-notifier:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/service-notifier/collabops-service-notifier:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "8083:8080"
    env_file:
      - ../../env/build-it/notifier.env
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=notifier"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # NFS path base: /srv/nfs/share/collabops/dev

  nfs_git_repos:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.0.30,nfsvers=4,rw"
      device: ":/srv/nfs/share/collabops/dev/git/repos"

  nfs_git_pipelines:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=192.168.0.30,nfsvers=4,rw"
      device: ":/srv/nfs/share/collabops/dev/git/pipelines"

networks:
  collabops-network:
    driver: bridge