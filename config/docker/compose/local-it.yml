version: '3.8'

services:
  # Git Executor (Go) - Build Locally
  collabops-git-executor:
    build:
      context: ../../../../collabops-git-executor
      dockerfile: config/docker/Dockerfile
    ports:
      - "${GIT_EXECUTOR_PORT:-5001}:5001"
      - "${GIT_EXECUTOR_SSH_PORT:-5222}:5222"
    env_file:
      - ../../env/local-it/git-executor.env
    volumes:
      - git_pipelines_data:${GIT_REPO_ROOT:-/var/lib/git/repos}
      - git_executor_data:${GIT_REPO_ROOT:-/var/lib/git/repos}
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=collabops-git-executor"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Orchestrator (FastAPI) - Pull from Artifact Registry
  collabops-api-orchestrator:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/api-orchestrator/collabops-api-orchestrator:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "${ORCHESTRATOR_PORT:-2345}:2345"

    volumes:
      - ./keys:/app/keys:ro

    env_file:
      - ../../env/local-it/common.env
      - ../../env/local-it/orchestrator.env

    depends_on:
      orchestrator-db:
        condition: service_healthy
      redis-orchestrator:
        condition: service_healthy
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=orchestrator"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2345/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # CollabOps API Service (Pre-built Image)
  collabops-api-service:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/api-service/collabops-api-service:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "${API_SERVICE_PORT:-8000}:8000"
    env_file:
      - ../../env/local-it/common.env
      - ../../env/local-it/api-service.env
    # Django management command will handle all startup
    depends_on:
      api-service-db:
        condition: service_healthy
      redis-api-service:
        condition: service_healthy
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=api-service"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web Frontend (Next.js App)
  collabops-web:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/web/collabops-web:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - ../../env/local-it/common.env
      - ../../env/local-it/web.env
    depends_on:
      - collabops-api-orchestrator
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=web"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache for Orchestrator
  redis-orchestrator:
    image: redis:7-alpine
    ports:
      - "${REDIS_ORCHESTRATOR_PORT:-6379}:6379"
    volumes:
      - orchestrator_redis_data:/data
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
        labels: "service=redis-orchestrator"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for API Service
  redis-api-service:
    image: redis:7-alpine
    ports:
      - "${REDIS_API_SERVICE_PORT:-6380}:6379"
    volumes:
      - api_service_redis_data:/data
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
        labels: "service=redis-api-service"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for API Service
  api-service-db:
    image: postgres:15-alpine
    env_file:
      - ../../env/local-it/api-service-db.env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - api_service_postgres_data:/var/lib/postgresql/data
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
        labels: "service=postgres-api-service"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-collabops}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for Orchestrator
  orchestrator-db:
    image: postgres:15-alpine
    env_file:
      - ../../env/local-it/orchestrator-db.env
    ports:
      - "${ORCHESTRATOR_DB_PORT:-5433}:5432"
    volumes:
      - orchestrator_postgres_data:/var/lib/postgresql/data
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
        labels: "service=postgres-orchestrator"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-collabops_orchestrator}"]
      interval: 10s
      timeout: 5s
      retries: 5
  # WTM (WorkTree Manager)
  collabops-service-wtm:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/service-wtm/collabops-service-wtm:latest
    platform: linux/amd64
    pull_policy: always 
    ports:
      - "${WTM_PORT:-8082}:8082"
    env_file:
      - ../../env/local-it/wtm.env
    volumes:
      # Read-write access to bare repositories (git worktree needs to create metadata)
      - git_pipelines_data:/var/lib/git/repos:rw
      - git_executor_data:/var/lib/git/repos:rw
      # Read-write access for workspaces
      - git_executor_data:/var/lib/git/pipelines:rw
    networks:
      - collabops-network
    depends_on:
      - collabops-git-executor
      - wtm-volume-init
    restart: unless-stopped
    user: "2000:2000"  # Run as non-root user (UID:GID 1000)
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=wtm"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # WTM Volume Initialization (runs once to set proper permissions)
  wtm-volume-init:
    image: alpine:3.19
    user: "0:0"  # root로 실행
    volumes:
      - git_executor_data:/data/repos:rw
      - git_executor_data:/data/pipelines:rw
    command:
      - sh
      - -c
      - |
        # git_pipelines_data 볼륨 권한 설정
        find /data/repos -type f -exec chmod o+r {} \; 2>/dev/null || true
        find /data/repos -type d -exec chmod o+rwx {} \; 2>/dev/null || true
        # wtm_pipelines 볼륨 권한 설정 (WTM이 사용할 work_root)
        mkdir -p /data/pipelines
        chown -R 2000:2000 /data/pipelines
        chmod -R 755 /data/pipelines
    restart: "no"


volumes:
  orchestrator_redis_data:
  api_service_redis_data:
  api_service_postgres_data:
  orchestrator_postgres_data:
  git_executor_data:
  wtm_pipelines:
  git_pipelines_data:
    
networks:
  collabops-network:
    driver: bridge
