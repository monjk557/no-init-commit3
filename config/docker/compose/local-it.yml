networks:
  collabops-network:
    driver: bridge

services:
  # Web Frontend (Next.js App)
  collabops-web:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/web/collabops-web:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      - NODE_ENV=development
      - ORCHESTRATOR_URL=http://collabops-api-orchestrator:2345
      - PORT=3000
      # Next Auth Configuration // 07.18 v4 to v5 migration
      - AUTH_SECRET=m42Wt/2noAcG+w2jQJpJzgAwzi38PHT4mGv3p6AY8U0=
      - AUTH_URL=http://localhost:3000
    volumes:
      # Mount source code for hot reloading during development
      - ../../../src:/app/src
      - ../../../public:/app/public
      # Mount configuration files
      - ../../../package.json:/app/package.json
      - ../../../next.config.js:/app/next.config.js
      - ../../../tailwind.config.js:/app/tailwind.config.js
      - ../../../postcss.config.js:/app/postcss.config.js
      - ../../../tsconfig.json:/app/tsconfig.json
      # Mount additional config files that might be needed
      - ../../../yarn.lock:/app/yarn.lock
      # Mount the .config directory for TypeScript base configuration
      - ../../../.config:/app/.config
      # Exclude node_modules to avoid conflicts
      - /app/node_modules
    # Smart package sync: only install if package.json is newer than node_modules
    command: sh -c "
      if [ ! -d node_modules ] || [ package.json -nt node_modules/.yarn-integrity ] || [ yarn.lock -nt node_modules/.yarn-integrity ]; then
        echo '📦 Package changes detected - installing dependencies...';
        yarn install --frozen-lockfile;
      else
        echo '✅ Dependencies are up to date';
      fi &&
      yarn dev"
    depends_on:
      - collabops-api-orchestrator
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Orchestrator (FastAPI) - Real Service
  collabops-api-orchestrator:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/api-orchestrator/collabops-api-orchestrator:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - '${ORCHESTRATOR_PORT:-2345}:2345'

    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_NAME=${APP_NAME:-"CollabOps API Orchestrator"}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-DEBUG}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-2345}
      - SECRET_KEY=${SECRET_KEY:-orchestrator_secret_key_dev}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - ENABLE_JWT_MIDDLEWARE=${ENABLE_JWT_MIDDLEWARE:-false}

      # URL Configuration - Comprehensive redirect prevention
      - ORCHESTRATOR_BASE_URL=http://localhost:2345
      - FRONTEND_BASE_URL=http://localhost:3000
      - NGINX_BASE_URL=http://localhost:80

      # CORS Settings
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000,http://localhost:3001

      # External Service URLs
      - SERVICE_API_URL=http://collabops-api-service:8000
      - DRF_BASE_URL=http://collabops-api-service:8000
      - DRF_API_KEY=${DRF_API_KEY:-api_service_key}
      - DRF_TIMEOUT=30
      - DRF_RETRY_COUNT=3

      # Git Executor Service Configuration
      - GIT_EXECUTOR_URL=http://collabops-git-executor:9090
      - GIT_EXECUTOR_BASE_PATH=/repos
      - GIT_EXECUTOR_TIMEOUT=60
      - GIT_EXECUTOR_RETRY_COUNT=3
      - GIT_EXECUTOR_API_KEY=${GIT_EXECUTOR_API_KEY:-git_executor_key_local}

      # Database Configuration
      - REDIS_URL=redis://orchestrator-redis:6379/0
      - REDIS_HOST=orchestrator-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      # Orchestrator DB settings (dedicated database) - using asyncpg driver
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@orchestrator-db:5432/collabops_orchestrator
      - DB_HOST=orchestrator-db
      - DB_PORT=5432
      - DB_NAME=collabops_orchestrator
      - DB_USER=postgres
      - DB_PASSWORD=postgres

    depends_on:
      orchestrator-db:
        condition: service_healthy
      orchestrator-redis:
        condition: service_healthy
      collabops-git-executor:
        condition: service_healthy
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2345/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # CollabOps Git Executor Service - Handles Git Operations
  collabops-git-executor:
    # For local development, build from local source
    # For production/CI, use: asia-northeast3-docker.pkg.dev/collabops-shared/git-executor/collabops-git-executor:latest
    build:
      context: ../../..
      dockerfile: deployments/Dockerfile
    image: collabops/git-executor:latest
    container_name: collabops-git-executor
    ports:
      - '${GIT_EXECUTOR_PORT:-9090}:9090'
    environment:
      # Server Configuration
      - COLLABOPS_SERVER_HOST=0.0.0.0
      - COLLABOPS_SERVER_PORT=9090
      - COLLABOPS_SERVER_BASE_PATH=/repos
      - COLLABOPS_SERVER_READ_TIMEOUT=60s
      - COLLABOPS_SERVER_WRITE_TIMEOUT=60s
      - COLLABOPS_SERVER_IDLE_TIMEOUT=300s
      - COLLABOPS_SERVER_HEALTH_CHECK_PATH=/health

      # Git Configuration
      - COLLABOPS_GIT_REPO_ROOT=/repos
      - COLLABOPS_GIT_ENABLE_PACKFILE=true
      - COLLABOPS_GIT_MAX_CACHE_SIZE=100
      - COLLABOPS_GIT_CACHE_TTL=5m

      # JWT Configuration (for API authentication)
      - COLLABOPS_JWT_ALGORITHM=HS256
      - COLLABOPS_JWT_SECRET_KEY=${GIT_EXECUTOR_JWT_SECRET:-git_executor_jwt_secret_local}

      # Logging Configuration
      - COLLABOPS_LOG_LEVEL=${GIT_EXECUTOR_LOG_LEVEL:-info}
      - COLLABOPS_LOG_FORMAT=json
      - COLLABOPS_LOG_OUTPUT=stdout
      - COLLABOPS_LOG_DEVELOPMENT=false

      # Integration Settings
      - APP_ENV=${APP_ENV:-local}
      - ENABLE_CORS=true
      - CORS_ORIGINS=http://localhost:2345

    volumes:
      # Git repositories storage
      - git_executor_repos:/repos
      # Configuration volume (if using file-based config)
      - ../../../config:/config:ro
      # Logs volume
      - git_executor_logs:/var/log/collabops
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/git-executor', '--health-check']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security settings
    security_opt:
      - no-new-privileges:true
    # Don't use read-only in development for easier debugging
    # read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m

  # Real CollabOps API Service (Pull from Artifact Registry)
  collabops-api-service:
    image: asia-northeast3-docker.pkg.dev/collabops-shared/api-service/collabops-api-service:latest
    platform: linux/amd64
    pull_policy: always
    ports:
      - '${API_SERVICE_PORT:-8000}:8000'
    environment:
      # Application Settings
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_NAME=${APP_NAME:-"CollabOps API Service"}
      - APP_LOG_LEVEL=${APP_LOG_LEVEL:-DEBUG}

      # Network & Security Settings
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,collabops-api-service
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001

      # Disable HTTPS redirects for development
      - SECURE_SSL_REDIRECT=false
      - SECURE_PROXY_SSL_HEADER=
      - SECURE_HSTS_SECONDS=0
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=false
      - SECURE_HSTS_PRELOAD=false
      - SECURE_CONTENT_TYPE_NOSNIFF=true
      - SECURE_BROWSER_XSS_FILTER=true

      # Disable Django security middleware that might cause redirects
      - DISABLE_SECURITY_MIDDLEWARE=true
      - FORCE_HTTP=true
      - DJANGO_SETTINGS_MODULE=config.settings.local

      # Database Configuration
      - DB_NAME=${DB_NAME:-collabops}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=api-service-db
      - DB_PORT=5432
      - DB_CONN_MAX_AGE=${DB_CONN_MAX_AGE:-0}
      - DB_SSLMODE=${DB_SSLMODE:-disable}

      # Redis Configuration
      - REDIS_URL=redis://api-service-redis:6379/0
      - REDIS_HOST=api-service-redis
      - REDIS_PORT=6379
      - REDIS_DB=0

      # API Configuration
      - DRF_API_KEY=${DRF_API_KEY:-api_service_key_local_it}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-for-local-integration-testing}

      # JWT Configuration
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - ENABLE_JWT_MIDDLEWARE=${ENABLE_JWT_MIDDLEWARE:-false}



      # Feature Flags
      - ENABLE_METRICS=${ENABLE_METRICS:-true}
      - USE_SQLITE=${USE_SQLITE:-0}
      - USE_DUMMY_CACHE=${USE_DUMMY_CACHE:-0}
      - CELERY_EAGER=${CELERY_EAGER:-1}

      # Superuser Configuration
      - DJANGO_SUPERUSER_USERNAME=${DJANGO_SUPERUSER_USERNAME:-admin}
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@collabops.ai}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-admin123}
      - DJANGO_SUPERUSER_FIRST_NAME=${DJANGO_SUPERUSER_FIRST_NAME:-Admin}
      - DJANGO_SUPERUSER_LAST_NAME=${DJANGO_SUPERUSER_LAST_NAME:-User}

      # Logging
      - GUNICORN_LOG_LEVEL=${GUNICORN_LOG_LEVEL:-info}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}

      # Network Configuration
      - HOST=${HOST:-0.0.0.0}

      # Migration control (auto|safe|aggressive|off)
      - MIGRATION_STRATEGY=${MIGRATION_STRATEGY:-auto}
    depends_on:
      api-service-db:
        condition: service_healthy
      api-service-redis:
        condition: service_healthy
    networks:
      - collabops-network
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'
        labels: 'service=api-service'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health/']
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database for API Service
  api-service-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=${DB_NAME:-collabops}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - api_service_postgres_data:/var/lib/postgresql/data
      - ./api-service-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-collabops}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for Orchestrator
  orchestrator-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=collabops_orchestrator
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - '${ORCHESTRATOR_DB_PORT:-5433}:5432'
    volumes:
      - orchestrator_postgres_data:/var/lib/postgresql/data
      - ./orchestrator-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${DB_USER:-postgres} -d collabops_orchestrator',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for Orchestrator
  orchestrator-redis:
    image: redis:7-alpine
    ports:
      - '${ORCHESTRATOR_REDIS_PORT:-6379}:6379'
    volumes:
      - orchestrator_redis_data:/data
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache for API Service
  api-service-redis:
    image: redis:7-alpine
    ports:
      - '${API_SERVICE_REDIS_PORT:-6380}:6379'
    volumes:
      - api_service_redis_data:/data
    networks:
      - collabops-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  api_service_postgres_data:
  orchestrator_postgres_data:
  orchestrator_redis_data:
  api_service_redis_data:
  git_executor_repos:
  git_executor_logs: