server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CORS headers for API documentation access
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Serve OpenAPI spec files with proper content type
    location ~ \.(yaml|yml)$ {
        add_header Content-Type "application/x-yaml; charset=utf-8" always;
        add_header Content-Disposition "inline" always;
        try_files $uri =404;
    }

    # Serve OpenAPI spec at multiple paths for compatibility
    location = /openapi.yaml {
        alias /usr/share/nginx/html/openapi.yaml;
        add_header Content-Type "application/x-yaml; charset=utf-8" always;
        add_header Content-Disposition "inline; filename=\"openapi.yaml\"" always;
    }

    location = /openapi.yml {
        alias /usr/share/nginx/html/openapi.yaml;
        add_header Content-Type "application/x-yaml; charset=utf-8" always;
        add_header Content-Disposition "inline; filename=\"openapi.yml\"" always;
    }

    location = /swagger.yaml {
        alias /usr/share/nginx/html/swagger.yaml;
        add_header Content-Type "application/x-yaml; charset=utf-8" always;
        add_header Content-Disposition "inline; filename=\"swagger.yaml\"" always;
    }

    location = /swagger.yml {
        alias /usr/share/nginx/html/swagger.yaml;
        add_header Content-Type "application/x-yaml; charset=utf-8" always;
        add_header Content-Disposition "inline; filename=\"swagger.yml\"" always;
    }

    location = /api/schema/ {
        alias /usr/share/nginx/html/openapi.yaml;
        add_header Content-Type "application/x-yaml; charset=utf-8" always;
        add_header Content-Disposition "inline; filename=\"openapi.yaml\"" always;
    }

    # Serve index.html for root path
    location = / {
        try_files /index.html =404;
    }

    # Default location
    location / {
        try_files $uri $uri/ =404;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}

