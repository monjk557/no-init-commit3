server:
  port: 8080
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

git:
  repo_root: /repos
  max_pack_size: 104857600  # 100MB
  enable_upload_pack: true
  enable_receive_pack: true

permissions:
  service_url: http://permission-mock:8081
  cache_ttl: 5m
  timeout: 10s

logging:
  level: debug
  format: json
  output: stdout

cache:
  repository_ttl: 10m
  max_size: 100

metrics:
  enabled: true
  endpoint: /metrics

health:
  enabled: true
  endpoint: /health 