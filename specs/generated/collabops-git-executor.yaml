          type: string
        tree:
          type: array
          items:
            $ref: '#/components/schemas/GitTreeEntryWithCommit'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/GitBranch'
        meta:
          $ref: '#/components/schemas/LatestCommitsMeta'
      required:
        - branches
        - name
        - owner
        - path
        - repository
        - success
        - tree
    UpdateBranchRequest:
      type: object
      properties:
        target:
          type: string
        new_name:
          type: string
        force:
          type: boolean
        message:
          type: string
    UpdateBranchResponse:
      type: object
      properties:
        success:
          type: boolean
        branch_name:
          type: string
        commit_hash:
          type: string
        previous_hash:
          type: string
        operation:
          type: string
        fast_forward:
          type: boolean
      required:
        - branch_name
        - commit_hash
        - fast_forward
        - operation
        - previous_hash
        - success


  responses:
    BadRequest:
      description: Bad request - Invalid input parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Invalid input parameters"

    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "X-USER-ID header is required"

    Forbidden:
      description: Forbidden - Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Insufficient permissions for this operation"

    NotFound:
      description: Not found - Repository or resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Repository not found"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "An unexpected error occurred"

