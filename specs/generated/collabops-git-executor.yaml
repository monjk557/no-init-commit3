      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/state:
    get:
      summary: HandleGetRepositoryState
      operationId: handlegetrepositorystate
      tags:
        - Repository State
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/tags:
    get:
      summary: HandleGetTags
      operationId: handlegettags
      tags:
        - Tags
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: HandleCreateTag
      operationId: handlecreatetag
      tags:
        - Tags
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/tags/{tag}:
    delete:
      summary: HandleDeleteTag
      operationId: handledeletetag
      tags:
        - Tags
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: tag
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/tree:
    get:
      summary: HandleTreeAPI
      operationId: handletreeapi
      tags:
        - Tree
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'


components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-USER-ID
      description: User authentication via X-USER-ID header

  parameters:
    Owner:
      name: owner
      in: path
      required: true
      description: Repository owner username
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
        example: "testowner"

    Repo:
      name: repo
      in: path
      required: true
      description: Repository name
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_.-]+$'
        example: "testrepo"

  schemas:
    AuthorInfo:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        date:
          type: string
      required:
        - date
        - email
        - name
    BlobErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        code:
          type: string
        details:
          type: string
      required:
        - error
        - success
    BlobOverviewResponse:
      type: object
      properties:
        success:
          type: boolean
        content:
          type: string
        lines:
          type: integer
        size:
          type: integer
        tree:
          type: array
          items:
            $ref: '#/components/schemas/GitTreeEntryWithCommit'
        branches:
          type: array
          items:
            $ref: '#/components/schemas/GitBranch'
        latest_commit:
          $ref: '#/components/schemas/GitCommit'
        commits:
          type: array
          items:
            $ref: '#/components/schemas/GitCommit'
      required:
        - branches
        - commits
        - content
        - latest_commit
        - lines
        - size
        - success
        - tree
    BlobRequestParams:
      type: object
    BranchInfo:
      type: object
    BranchListItem:
      type: object
      properties:
        name:
          type: string
        updated:
          type: string
        updated_by:
          type: string
        commit_sha:
          type: string
        commit_message:
          type: string
        is_default:
          type: boolean
        behind:
          type: integer
        ahead:
          type: integer
        change_request:
          $ref: '#/components/schemas/ChangeRequestInfo'
        created_by:
          type: string
        days_since_last_commit:
          type: integer
      required:
        - ahead
        - behind
        - change_request
        - commit_message
        - commit_sha
        - created_by
        - days_since_last_commit
        - is_default
        - name
        - updated
        - updated_by
    BranchesListResponse:
      type: object
      properties:
        default:
          type: array
          items:
            $ref: '#/components/schemas/BranchListItem'
        yours:
          type: array
          items:
            $ref: '#/components/schemas/BranchListItem'
        active:
          type: array
          items:
            $ref: '#/components/schemas/BranchListItem'
        stale:
          type: array
          items:
            $ref: '#/components/schemas/BranchListItem'
        total_count:
          type: integer
      required:
        - active
        - default
        - stale
        - total_count
        - yours
    BranchesOverviewResponse:
      type: object
      properties:
        success:
          type: boolean
        default:
          type: array
          items:
            $ref: '#/components/schemas/BranchListItem'
        yours:
          type: array
          items:
            $ref: '#/components/schemas/BranchListItem'
        active:
          type: array
          items:
            $ref: '#/components/schemas/BranchListItem'
        stale:
          type: array
          items:
            $ref: '#/components/schemas/BranchListItem'
        total_count:
          type: integer
      required:
        - active
        - default
        - stale
        - success
        - total_count
        - yours
    ChangeRequestInfo:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        state:
          type: string
        url:
          type: string
      required:
        - id
        - state
        - title
        - url
    ChangesSummary:
      type: object
      properties:
        total_files:
          type: integer
        added_files:
          type: integer
        modified_files:
          type: integer
        deleted_files:
          type: integer
        renamed_files:
          type: integer
        lines_added:
          type: integer
        lines_deleted:
          type: integer
        binary_files:
          type: integer
      required:
        - added_files
        - binary_files
        - deleted_files
        - lines_added
        - lines_deleted
        - modified_files
        - renamed_files
        - total_files
    Commit:
      type: object
      properties:
        sha:
          type: string
        author:
          $ref: '#/components/schemas/CommitAuthor'
        committer:
          $ref: '#/components/schemas/CommitAuthor'
        message:
          type: string
        parent_hashes:
          type: array
          items:
            type: string
        tree_hash:
          type: string
      required:
        - author
        - committer
        - message
        - parent_hashes
        - sha
        - tree_hash
    CommitAuthor:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        date:
          type: string
          format: date-time
      required:
        - date
        - email
        - name
    CommitInfo:
      type: object
      properties:
        sha:
          type: string
        message:
          type: string
        author:
          $ref: '#/components/schemas/AuthorInfo'
        committer:
          $ref: '#/components/schemas/AuthorInfo'
        created_at:
          type: string
      required:
        - author
        - committer
        - created_at
        - message
        - sha
    CommitMetadata:
      type: object
      properties:
        sha:
          type: string
        author:
          type: string
        email:
          type: string
        date:
          type: string
        message:
          type: string
        parents:
          type: array
          items:
            type: string
      required:
        - author
        - date
        - email
        - message
        - parents
        - sha
    CommitOptions:
      type: object
      properties:
        validate_only:
          type: boolean
        allow_partial_commit:
          type: boolean
        timeout:
          type: object
        dry_run:
          type: boolean
    CommitStats:
      type: object
      properties:
        ahead:
          type: integer
        behind:
          type: integer
      required:
        - ahead
        - behind
    CommitsByDate:
      type: object
      properties:
        date:
          type: string
        commits:
          type: array
          items:
            $ref: '#/components/schemas/CommitMetadata'
      required:
        - commits
        - date
    CommitsErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        code:
          type: string
        details:
          type: string
      required:
        - error
        - success
    CommitsRequestParams:
      type: object
    CommitsResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/CommitsByDate'
        merge_base:
          type: string
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
      required:
        - message
        - pagination
        - results
        - success
    ConflictRegion:
      type: object
      properties:
        start_line:
          type: integer
        end_line:
          type: integer
        our_content:
          type: string
        their_content:
          type: string
        base_content:
          type: string
        marker_style:
          type: string
      required:
        - base_content
        - end_line
        - marker_style
        - our_content
        - start_line
        - their_content
    ConflictResolution:
      type: object
      properties:
        strategy:
          type: string
        content:
          type: string
        confidence:
          type: number
        auto_applied:
          type: boolean
        reasoning:
          type: string
        alternatives:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
      required:
        - alternatives
        - auto_applied
        - confidence
        - content
        - reasoning
        - strategy
    CountSummary:
      type: object
      properties:
        commits:
          type: integer
        files:
          type: integer
        contributors:
          type: integer
      required:
        - commits
        - contributors
        - files
    CreateBranchData:
      type: object
      properties:
        branch_name:
          type: string
        commit_sha:
          type: string
        source:
          type: string
        ref_path:
          type: string
        is_new_branch:
          type: boolean
        message:
          type: string
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/CreateBranchDetails'
      required:
        - branch_name
        - commit_sha
        - created_at
        - details
        - is_new_branch
        - message
        - ref_path
        - source
    CreateBranchDetails:
      type: object
      properties:
        checkout:
          type: boolean
        force_used:
          type: boolean
        author:
          type: string
      required:
        - author
        - checkout
        - force_used
    CreateBranchRequest:
      type: object
      properties:
        name:
          type: string
        source:
          type: string
        source_branch:
          type: string
        force:
          type: boolean
        checkout:
          type: boolean
        author_name:
          type: string
        author_email:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required:
        - name
    CreateBranchResponse:
      type: object
      properties:
        success:
          type: boolean
        branch_name:
          type: string
        commit_sha:
          type: string
        source:
          type: string
        ref_path:
          type: string
        is_new_branch:
          type: boolean
        message:
          type: string
        created_at:
          type: string
          format: date-time
        details:
          $ref: '#/components/schemas/CreateBranchDetails'
      required:
        - branch_name
        - commit_sha
        - created_at
        - details
        - is_new_branch
        - message
        - ref_path
        - source
        - success
    CreateRepositoryOptions:
      type: object
    CreateRepositoryRequest:
      type: object
      properties:
        private:
          type: boolean
        initial_commit:
          type: boolean
        default_branch:
          type: string
        author:
          $ref: '#/components/schemas/CommitAuthor'
        initial_files:
          type: object
          additionalProperties: true
        metadata:
