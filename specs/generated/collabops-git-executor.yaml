  /repos/{owner}/{repo}/branches/{branch}:
    patch:
      summary: HandleUpdateBranch
      operationId: handleupdatebranch
      tags:
        - Branches
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: branch
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
    delete:
      summary: HandleDeleteBranch
      operationId: handledeletebranch
      tags:
        - Branches
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: branch
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/commits:
    get:
      summary: HandleCommitsAPI
      operationId: handlecommitsapi
      tags:
        - Commits
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      summary: HandleMultiFileCommit
      operationId: handlemultifilecommit
      tags:
        - Commits
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiFileCommitRequest'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/diff/branches/{base}/{head}:
    get:
      summary: HandleBranchDiff
      operationId: handlebranchdiff
      tags:
        - Branches
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: base
          in: path
          required: true
          schema:
            type: string
        - name: head
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/diff/commit/{sha}:
    get:
      summary: HandleSingleCommitDiff
      operationId: handlesinglecommitdiff
      tags:
        - Diff
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: sha
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/diff/commits/{base}/{head}:
    get:
      summary: HandleCommitDiff
      operationId: handlecommitdiff
      tags:
        - Commits
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: base
          in: path
          required: true
          schema:
            type: string
        - name: head
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/diff/file:
    get:
      summary: HandleFileDiff
      operationId: handlefilediff
      tags:
        - Diff
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/diff/patch/{base}/{head}:
    get:
      summary: HandlePatch
      operationId: handlepatch
      tags:
        - Diff
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: base
          in: path
          required: true
          schema:
            type: string
        - name: head
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/merges:
    post:
      summary: HandleMerge
      operationId: handlemerge
      tags:
        - Merge
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/merges/preview:
    get:
      summary: HandleMergePreview
      operationId: handlemergepreview
      tags:
        - Merge
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/overview:
    get:
      summary: HandleGetRepositoryOverview
      operationId: handlegetrepositoryoverview
      tags:
        - Overview
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/overview/blob:
    get:
      summary: HandleGetBlobOverview
      operationId: handlegetbloboverview
      tags:
        - Blob
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/overview/branches:
    get:
      summary: HandleGetBranchesOverview
      operationId: handlegetbranchesoverview
      tags:
        - Branches
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/overview/latest-commits:
    post:
      summary: HandlePostLatestCommitsBatch
      operationId: handlepostlatestcommitsbatch
      tags:
        - Overview
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/overview/tree:
    get:
      summary: HandleGetTreeOverview
      operationId: handlegettreeoverview
      tags:
        - Tree
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/overview/tree/commits:
    get:
      summary: HandleGetTreeWithCommitOverview
      operationId: handlegettreewithcommitoverview
      tags:
