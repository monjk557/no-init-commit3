          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/branches/resolve/{ref}:
    get:
      summary: HandleResolveBranch
      operationId: handleresolvebranch
      tags:
        - Branches
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '400':
          $ref: '#/components/responses/BadRequest'
  /repos/{owner}/{repo}/branches/validate/{name}:
    get:
      summary: HandleValidateBranchName
      operationId: handlevalidatebranchname
      tags:
        - Branches
      parameters:
        - $ref: '#/components/parameters/Owner'
        - $ref: '#/components/parameters/Repo'
        - name: name
