components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-USER-ID
      description: User authentication via X-USER-ID header

  parameters:
    Owner:
      name: owner
      in: path
      required: true
      description: Repository owner username
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
        example: "testowner"

    Repo:
      name: repo
      in: path
      required: true
      description: Repository name
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_.-]+$'
        example: "testrepo"

  schemas:
    AnchorRequest:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        start_line:
          type: integer
        end_line:
          type: integer
        commit_sha:
          type: string
      required:
        - end_line
        - id
        - path
        - start_line
    AnchorResult:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, stale, orphaned]
        new_path:
          type: string
      required:
        - id
        - status
    BlobBinaryResponse:
      type: object
      properties:
        success:
          type: boolean
        is_binary:
          type: boolean
        content_type:
          type: string
        size:
          type: integer
        path:
          type: string
      required:
        - content_type
        - is_binary
        - path
        - size
        - success
    BlobErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        code:
          type: string
        details:
          type: string
      required:
        - error
        - success
    BlobOverviewResponse:
      type: object
      properties:
        success:
          type: boolean
        is_binary:
          type: boolean
        is_lfs_pointer:
          type: boolean
        lfs:
          $ref: '#/components/schemas/LFSPointerInfo'
        content:
          type: string
        content_type:
          type: string
        lines:
          type: integer
        size:
          type: integer
        tree:
          type: array
          items:
            $ref: '#/components/schemas/GitTreeEntryWithCommit'
          nullable: true
        branches:
          type: array
          items:
            $ref: '#/components/schemas/GitBranch'
          nullable: true
        latest_commit:
          $ref: '#/components/schemas/GitCommit'
        commits:
          type: array
          items:
            $ref: '#/components/schemas/GitCommit'
          nullable: true
      required:
        - branches
        - commits
        - content
        - is_binary
        - is_lfs_pointer
        - lines
        - size
        - success
        - tree
    BlobRequestParams:
      type: object
    BranchAheadBehind:
      type: object
    BranchDiffQueryRequest:
      type: object
    BranchInfo:
      type: object
      properties:
        name:
          type: string
        commit_sha:
          type: string
        ref_path:
          type: string
        is_head:
          type: boolean
        last_commit:
          $ref: '#/components/schemas/BranchesCommitInfo'
        date:
          type: string
          format: date-time
        committer_email:
          type: string
      required:
        - commit_sha
        - committer_email
        - date
        - is_head
        - name
        - ref_path
    BranchListItem:
      type: object
      properties:
        name:
          type: string
        updated:
          type: string
        updated_by:
          type: string
        commit_sha:
          type: string
        commit_message:
          type: string
        is_default:
          type: boolean
        behind:
          type: integer
        ahead:
          type: integer
        change_request:
          $ref: '#/components/schemas/ChangeRequestInfo'
        created_by:
          type: string
